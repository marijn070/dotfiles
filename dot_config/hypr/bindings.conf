# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm app -- $TERMINAL
$browser = uwsm app -- $BROWSER

bindd = SUPER, T, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd || echo $HOME)"
bindd = SUPER, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser (private), exec, $browser --private
# bindd = SUPER, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER, S, Signal, exec, omarchy-launch-or-focus signal "uwsm app -- signal-desktop"
bindd = SUPER, N, Obsidian, exec, omarchy-launch-or-focus obsidian "uwsm app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER, slash, Passwords, exec, uwsm app -- 1password
bindd = SUPER, Z, Zed, exec, omarchy-launch-editor
bindd = SUPER, O, OpenCode, exec, omarchy-launch-tui opencode

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER, E, Email, exec, omarchy-launch-webapp "https://mail.google.com"
bindd = SUPER, Y, YouTube, exec, omarchy-launch-or-focus-webapp YouTube "https://youtube.com/"
unbind = SUPER, W
bindd = SUPER, W, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER ALT, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
unbind = SUPER, Q
bindd = SUPER, Q, Close, killactive
bindd = SUPER, M, Maximise, fullscreen, 0
# unbind = SUPER SHIFT, M, Music
# bindd = SUPER SHIFT, M, Maximise, fullscreen, 0

# Planify Tasks
unbind = SUPER, P
unbind = SUPER SHIFT, P
bindd = SUPER, P, Add Task, exec, planify.quick-add
bindd = SUPER SHIFT, P, Planify, exec, planify

# Vim Motion
unbind = SUPER, H
unbind = SUPER, J
unbind = SUPER, K
unbind = SUPER, L
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r

unbind = SUPER SHIFT, H
unbind = SUPER SHIFT, J
unbind = SUPER SHIFT, K
unbind = SUPER SHIFT, L
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, L, movewindow, r

### Workspaces ###

# Unbind Omarchy workspace bindings
unbind = SUPER, GRAVE
unbind = SUPER, code:10
unbind = SUPER, code:11
unbind = SUPER, code:12
unbind = SUPER, code:13
unbind = SUPER, code:14
unbind = SUPER, code:15
unbind = SUPER, code:16
unbind = SUPER, code:17
unbind = SUPER, code:18
unbind = SUPER, code:19
unbind = SUPER SHIFT, code:10
unbind = SUPER SHIFT, code:11
unbind = SUPER SHIFT, code:12
unbind = SUPER SHIFT, code:13
unbind = SUPER SHIFT, code:14
unbind = SUPER SHIFT, code:15
unbind = SUPER SHIFT, code:16
unbind = SUPER SHIFT, code:17
unbind = SUPER SHIFT, code:18
unbind = SUPER SHIFT, code:19

# Bindings for moving to workspaces
bind = SUPER, GRAVE, workspace, 1
bind = SUPER, 1, workspace, 2
bind = SUPER, 2, workspace, 3
bind = SUPER, 3, workspace, 4
bind = SUPER, 4, workspace, 5
bind = SUPER, 5, workspace, 6
bind = SUPER, 6, workspace, 7
bind = SUPER, 7, workspace, 8
bind = SUPER, 8, workspace, 9
bind = SUPER, 9, workspace, 10
bind = SUPER, 0, workspace, 11

# moving windows to workspaces
bind = SUPER SHIFT, GRAVE, movetoworkspace, 1
bind = SUPER SHIFT, 1, movetoworkspace, 2
bind = SUPER SHIFT, 2, movetoworkspace, 3
bind = SUPER SHIFT, 3, movetoworkspace, 4
bind = SUPER SHIFT, 4, movetoworkspace, 5
bind = SUPER SHIFT, 5, movetoworkspace, 6
bind = SUPER SHIFT, 6, movetoworkspace, 7
bind = SUPER SHIFT, 7, movetoworkspace, 8
bind = SUPER SHIFT, 8, movetoworkspace, 9
bind = SUPER SHIFT, 9, movetoworkspace, 10
bind = SUPER SHIFT, 0, movetoworkspace, 11

bind = SUPER CTRL SHIFT, J, movetoworkspace, +1
bind = SUPER CTRL SHIFT, K, movetoworkspace, -1

# moving between workspaces
bind = SUPER CTRL, J, workspace, m+1
bind = SUPER CTRL, K, workspace, m-1
bind = SUPER, mouse_up, workspace, m+1
bind = SUPER, mouse_down, workspace, m-1

# moving workspaces between monitors
bind = SUPER CTRL ALT, J, movecurrentworkspacetomonitor, d
bind = SUPER CTRL ALT, K, movecurrentworkspacetomonitor, u
bind = SUPER CTRL ALT, H, movecurrentworkspacetomonitor, l
bind = SUPER CTRL ALT, L, movecurrentworkspacetomonitor, r

# move all workspaces to correct monitors
bind = SUPER CTRL ALT, M, exec, ~/.local/bin/fix-workspaces.sh
