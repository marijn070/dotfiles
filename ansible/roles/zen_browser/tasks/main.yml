---
- name: Install wget for downloading Zen Browser
  package:
    name: wget
    state: present

- name: Check if Zen Browser is already installed
  stat:
    path: /opt/zen-browser-bin/zen
  register: zen_installed

- name: Download Zen Browser tarball
  get_url:
    url: https://github.com/zen-browser/desktop/releases/latest/download/zen.linux-x86_64.tar.xz
    dest: /tmp/zen.linux-x86_64.tar.xz
    mode: "0644"
  when: not zen_installed.stat.exists

- name: Create Zen Browser directory
  file:
    path: /opt/zen-browser-bin
    state: directory
    mode: "0755"
  when: not zen_installed.stat.exists

- name: Extract Zen Browser to /opt
  unarchive:
    src: /tmp/zen.linux-x86_64.tar.xz
    dest: /opt/zen-browser-bin
    remote_src: true
    extra_opts: [--strip-components=1]
  when: not zen_installed.stat.exists

- name: Clean up downloaded tarball
  file:
    path: /tmp/zen.linux-x86_64.tar.xz
    state: absent
  when: not zen_installed.stat.exists

- name: Create 1Password configuration directory
  file:
    path: /etc/1password
    state: directory
    mode: "0755"

- name: Configure 1Password to allow Zen browser
  lineinfile:
    path: /etc/1password/custom_allowed_browsers
    line: "zen-bin"
    create: true
    owner: root
    group: root
    mode: "0755"
