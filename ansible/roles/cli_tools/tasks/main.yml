---
# Install common CLI tools
- name: Install common CLI tools
  package:
    name:
      - fish
      - fzf
      - ripgrep
      - zoxide
      - bat
      - lazygit
      - "{{ 'fd-find' if ansible_facts['os_family'] in ['Debian', 'RedHat'] else 'fd' }}"
    state: present

# Install eza
- name: Enable eza COPR repository (Fedora)
  command: dnf copr enable alternateved/eza -y
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install eza
  package:
    name: eza
    state: present

# Install bat-extras
- name: Enable bat-extras COPR repository (Fedora)
  command: dnf copr enable awood/bat-extras -y
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install bat-extras (Arch/Fedora)
  package:
    name: bat-extras
    state: present
  when: ansible_facts['os_family'] in ['ArchLinux', 'RedHat']

- name: Clone and install bat-extras (Debian)
  block:
    - name: Clone bat-extras repository
      git:
        repo: https://github.com/eth-p/bat-extras.git
        dest: /tmp/bat-extras
        version: master
    - name: Build and install bat-extras
      command: ./build.sh --install --prefix=/usr/local
      args:
        chdir: /tmp/bat-extras
  when: ansible_facts['os_family'] == 'Debian'

# Create symlinks for renamed packages
- name: Check if batcat exists
  stat:
    path: /usr/bin/batcat
  register: batcat_exists

- name: Create symlink for bat
  file:
    src: /usr/bin/batcat
    dest: /usr/local/bin/bat
    state: link
  when: batcat_exists.stat.exists
  ignore_errors: true

- name: Check if fdfind exists
  stat:
    path: /usr/bin/fdfind
  register: fdfind_exists

- name: Create symlink for fd
  file:
    src: /usr/bin/fdfind
    dest: /usr/local/bin/fd
    state: link
  when: fdfind_exists.stat.exists
  ignore_errors: true

# Install starship
- name: Download and install starship
  shell: curl -sS https://starship.rs/install.sh | sh -s -- -y
  args:
    creates: /usr/local/bin/starship

# Configure fish shell
- name: Get fish shell path
  command: which fish
  register: fish_path
  changed_when: false
  become: false

- name: Ensure fish is in /etc/shells
  lineinfile:
    path: /etc/shells
    line: "{{ fish_path.stdout }}"
    state: present

- name: Set fish as default shell
  user:
    name: "{{ actual_user }}"
    shell: "{{ fish_path.stdout }}"
