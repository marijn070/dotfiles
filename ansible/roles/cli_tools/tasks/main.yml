---
# Get the actual user's home directory before any become operations
- name: Get actual user information
  set_fact:
    actual_user: "{{ lookup('env', 'USER') }}"
    actual_home: "{{ lookup('env', 'HOME') }}"
  become: false

# Install Rust toolchain in user's home directory
- name: Check if cargo is installed for user
  command: which cargo
  register: cargo_check
  failed_when: false
  changed_when: false
  become: false
  become_user: "{{ actual_user }}"

- name: Install dependencies for Rust installation
  package:
    name: curl
    state: present
  when: cargo_check.rc != 0

- name: Download rustup installer
  get_url:
    url: https://sh.rustup.rs
    dest: /tmp/rustup-init.sh
    mode: "0755"
  when: cargo_check.rc != 0

- name: Install Rust via rustup in user home directory
  shell: /tmp/rustup-init.sh -y
  args:
    creates: "{{ actual_home }}/.cargo/bin/cargo"
  when: cargo_check.rc != 0
  become: false
  become_user: "{{ actual_user }}"
  environment:
    CARGO_HOME: "{{ actual_home }}/.cargo"
    RUSTUP_HOME: "{{ actual_home }}/.rustup"

- name: Set cargo binary path
  set_fact:
    cargo_bin: "{{ actual_home }}/.cargo/bin/cargo"

# Install CLI tools on Arch Linux (pacman)
- name: Install CLI tools on Arch Linux
  pacman:
    name:
      - eza
      - fish
      - bat
      - fzf
      - ripgrep
      - fd
      - starship
      - zoxide
    state: present
  when: ansible_os_family == "Archlinux"

# Install CLI tools on Fedora (dnf)
- name: Install CLI tools on Fedora
  dnf:
    name:
      - eza
      - fish
      - bat
      - fzf
      - ripgrep
      - fd-find
      - starship
      - zoxide
    state: present
  when: ansible_distribution == "Fedora"

# Install CLI tools on Debian/Ubuntu (apt)
- name: Install base CLI tools on Debian/Ubuntu
  apt:
    name:
      - fish
      - fzf
      - ripgrep
      - fd-find
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install bat on Debian/Ubuntu
  apt:
    name: batcat
    state: present
  when: ansible_os_family == "Debian"

# Install tools via cargo for Debian/Ubuntu (when not in repos)
- name: Install eza via cargo on Debian/Ubuntu
  shell: "{{ cargo_bin }} install eza"
  args:
    creates: "{{ actual_home }}/.cargo/bin/eza"
  when: ansible_os_family == "Debian"
  become: false
  become_user: "{{ actual_user }}"
  environment:
    CARGO_HOME: "{{ actual_home }}/.cargo"

- name: Download starship installer
  get_url:
    url: https://starship.rs/install.sh
    dest: /tmp/starship-install.sh
    mode: "0755"
  when: ansible_os_family == "Debian"

- name: Install starship on Debian/Ubuntu
  shell: /tmp/starship-install.sh -y
  args:
    creates: /usr/local/bin/starship
  when: ansible_os_family == "Debian"

- name: Install zoxide via cargo on Debian/Ubuntu
  shell: "{{ cargo_bin }} install zoxide"
  args:
    creates: "{{ actual_home }}/.cargo/bin/zoxide"
  when: ansible_os_family == "Debian"
  become: false
  become_user: "{{ actual_user }}"
  environment:
    CARGO_HOME: "{{ actual_home }}/.cargo"

# Create symlinks for differently named packages on Debian/Ubuntu
- name: Create symlink for bat on Debian/Ubuntu
  file:
    src: /usr/bin/batcat
    dest: /usr/local/bin/bat
    state: link
  when: ansible_os_family == "Debian"
  ignore_errors: true

- name: Create symlink for fd on Debian/Ubuntu
  file:
    src: /usr/bin/fdfind
    dest: /usr/local/bin/fd
    state: link
  when: ansible_os_family == "Debian"
  ignore_errors: true

# Change default shell to fish
- name: Get fish shell path
  command: which fish
  register: fish_path
  changed_when: false

- name: Ensure fish is in /etc/shells
  lineinfile:
    path: /etc/shells
    line: "{{ fish_path.stdout }}"
    state: present

- name: Change default shell to fish for current user
  user:
    name: "{{ actual_user }}"
    shell: "{{ fish_path.stdout }}"
