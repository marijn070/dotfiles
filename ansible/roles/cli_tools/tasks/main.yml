---
# Install common CLI tools (available in all distros)
- name: Install common CLI tools
  package:
    name:
      - fish
      - fzf
      - ripgrep
      - eza
      - zoxide
      - bat
      - fd
    state: present

# Create symlinks for differently named packages on Debian/Ubuntu
- name: Create symlink for bat on Debian/Ubuntu
  file:
    src: /usr/bin/batcat
    dest: /usr/local/bin/bat
    state: link
  when: ansible_facts['os_family'] == "Debian"
  ignore_errors: true

- name: Create symlink for fd on Debian/Ubuntu
  file:
    src: /usr/bin/fdfind
    dest: /usr/local/bin/fd
    state: link
  when: ansible_facts['os_family'] == "Debian"
  ignore_errors: true

- name: Download starship installer
  get_url:
    url: https://starship.rs/install.sh
    dest: /tmp/starship-install.sh
    mode: "0755"

- name: Install starship
  shell: /tmp/starship-install.sh -y
  args:
    creates: /usr/bin/starship

# Change default shell to fish
- name: Get fish shell path
  command: which fish
  register: fish_path
  changed_when: false
  become: false

- name: Ensure fish is in /etc/shells
  lineinfile:
    path: /etc/shells
    line: "{{ fish_path.stdout }}"
    state: present

- name: Change default shell to fish for current user
  user:
    name: "{{ actual_user }}"
    shell: "{{ fish_path.stdout }}"
