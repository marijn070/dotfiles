---
# Switch chezmoi git remote from HTTPS to SSH after 1Password is set up

- name: Get current chezmoi source directory
  command: chezmoi source-path
  register: chezmoi_source
  changed_when: false
  become: false
  become_user: "{{ actual_user }}"

- name: Get current git remote URL
  command: git -C "{{ chezmoi_source.stdout }}" remote get-url origin
  register: current_remote
  changed_when: false
  become: false
  become_user: "{{ actual_user }}"
  failed_when: false

- name: Convert HTTPS remote to SSH
  command: |
    git -C "{{ chezmoi_source.stdout }}" remote set-url origin "git@github.com:marijn070/dotfiles.git"
  become: false
  become_user: "{{ actual_user }}"
  when: current_remote.rc == 0 and 'https://' in current_remote.stdout
